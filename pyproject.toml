[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scrape-scheduler-kit"
version = "0.1.0"
description = "Config-driven scraping + scheduled execution kit (robots.txt-respecting) with CSV/JSONL/Google Sheets output"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
sheets = ["gspread>=6.0"]
dev = ["pytest>=8"]

[project.scripts]
scrape-kit = "scrape_kit.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["scrape_kit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
